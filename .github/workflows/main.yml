name: Build and Release

# Pull requests and pushes only build Actions artifacts. A formal release can
# only be requested through workflow_dispatch after all validation succeeds.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_call:
    inputs:
      build-version:
        description: '用于产物文件名的版本标识'
        required: true
        type: string
      publish-release:
        description: '构建成功后创建新的正式发布页'
        required: false
        default: false
        type: boolean
      release-tag:
        description: '新发布使用的标签'
        required: true
        type: string
      release-name:
        description: '新发布页面显示的名称'
        required: true
        type: string
      source-ref:
        description: '需要检出、测试和打包的精确提交或引用'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build-version:
        description: '用于产物文件名的版本标识；留空时使用手动构建时间'
        required: false
        type: string
      publish-release:
        description: '构建成功后创建新的正式发布页'
        required: false
        default: false
        type: boolean
      release-tag:
        description: '新发布使用的标签；禁止与现有标签重复'
        required: false
        type: string
      release-name:
        description: '新发布页面显示的名称'
        required: false
        type: string
      source-ref:
        description: '需要检出、测试和打包的精确提交或引用；留空时使用当前提交'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# The pinned LizardByte release action still composes a Node.js 20 action.
# Run it on Node.js 24 ahead of GitHub's fall 2026 Node.js 20 removal.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_build_auto.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_commit: ${{ steps.setup_build_auto.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_name: ${{ steps.setup_build_auto.outputs.release_name || steps.setup_release_manual.outputs.release_name }}
      release_tag: ${{ steps.setup_build_auto.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Actions artifact build
        id: setup_build_auto
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'
        shell: bash
        run: |
          VERSION="ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          echo "publish_release=false" >> "$GITHUB_OUTPUT"
          echo "release_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ inputs['publish-release'] }}
          REQUESTED_NAME: ${{ inputs['release-name'] }}
          REQUESTED_TAG: ${{ inputs['release-tag'] }}
          REQUESTED_VERSION: ${{ inputs['build-version'] }}
          REQUESTED_SOURCE_REF: ${{ inputs['source-ref'] }}
        run: |
          SUFFIX=$([ "${{ github.ref_name }}" = "master" ] && echo "" || echo "-dev")
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}"
          fi
          TAG="${REQUESTED_TAG:-$VERSION}"
          NAME="${REQUESTED_NAME:-$TAG}"
          SOURCE_REF="${REQUESTED_SOURCE_REF:-${{ github.sha }}}"
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo '::error::正式发布只能由用户手动触发 main.yml。'
              exit 1
            fi
            if [ -z "$REQUESTED_TAG" ]; then
              echo '::error::正式发布必须显式填写 release-tag。'
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::标签 ${TAG} 已存在，禁止覆盖。"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::发布 ${TAG} 已存在，禁止覆盖。"
              exit 1
            fi
          fi
          echo "publish_release=${PUBLISH_RELEASE}" >> $GITHUB_OUTPUT
          echo "release_commit=${SOURCE_REF}" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

  vdd_smoke:
    name: VDD helper smoke tests
    needs: setup_release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup_release.outputs.release_commit }}

      - name: Run VDD helper smoke tests
        shell: pwsh
        run: |
          & .\src_assets\windows\misc\vdd\smoke-test-vdd-device-helper.ps1
          & .\src_assets\windows\misc\vdd\smoke-test-install-vdd-selection.ps1

  build_win:
    name: Windows
    needs: setup_release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup_release.outputs.release_commit }}
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          # Required, not redundant with the `pacman -Syu` below. When
          # msys2-runtime itself needs upgrading, pacman closes every MSYS2
          # process to finish the job, which kills the workflow shell and fails
          # the step with exit 1. setup-msys2 performs that upgrade with the
          # restart it needs; by the time our own step runs, the runtime is
          # already current and only the dependency list is left to install.
          update: true
          install: >-
            wget
            curl

      - name: Update Windows dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          # download pinned opus version
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget https://repo.msys2.org/mingw/ucrt64/${opus_tarball}

          # install dependencies
          # NOTE: gcc/gcc-libs were previously pinned to 15.1.0-5 to work around
          # a broken upstream gcc 15.x. Since msys2 has moved on to gcc 16.x and
          # other packages (cmake, etc.) now require gcc-libs 16.x ABI, pinning
          # an old gcc-libs causes cmake.exe to silently fail to load (exit 127).
          # Let pacman install the full toolchain at the current upstream version.
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-ccache"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            # "mingw-w64-ucrt-x86_64-nodejs"  # Replaced by actions/setup-node (vite 8 requires MSVC Node.js)
            # "mingw-w64-ucrt-x86_64-nsis"  # Replaced by Inno Setup
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )

          pacman -Syu --noconfirm "${dependencies[@]}"

          # install pinned opus after Syu to prevent upgrade
          pacman --noconfirm -U ${opus_tarball}

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which cmake || (echo "cmake not found" && exit 1)
          which ninja || (echo "ninja not found" && exit 1)
          which gcc || (echo "gcc not found" && exit 1)
          
          echo "All build tools verified successfully"
          echo "  CMake: $(cmake --version | head -1)"
          echo "  Ninja: $(ninja --version)"
          echo "  GCC: $(gcc --version | head -1)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET for DualSense sidecar
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained DualSense sidecar
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
        run: .\scripts\build-ds5-sidecar.ps1 -ReleaseTag $env:RELEASE_TAG

      - name: Build Web UI
        shell: pwsh
        run: |
          npm ci
          npm run lint:webui
          npm run test:webui
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:SUNSHINE_SOURCE_ASSETS_DIR = "${{ github.workspace }}\src_assets"
          $env:SUNSHINE_ASSETS_DIR = "${{ github.workspace }}\build"
          npm run build

      - name: Cache compiler objects
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.ccache
          # The key must be unique per run for the cache to be written at all,
          # so the prefix restore-key is what actually produces the hits: every
          # run seeds itself from the most recent previous one.
          key: ccache-windows-${{ github.run_id }}
          restore-keys: |
            ccache-windows-

      - name: Build Windows
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          GITHUB_TOKEN: ${{ secrets.DRIVER_DOWNLOAD_TOKEN }}
          # ccache.exe is a native binary, so it reads the Windows-style path
          # straight out of the environment even under the msys2 shell.
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          # `pacman -Syu` can move the toolchain underneath us between runs.
          # Hashing the compiler binary instead of its mtime keeps the cache
          # valid across runs that did not actually change gcc.
          CCACHE_COMPILERCHECK: content
          # Fork PRs cannot access org-scoped secrets, so private-repo driver
          # downloads (vmouse) may fail. Downgrade missing drivers from
          # FATAL_ERROR to WARNING so the build/configure still succeeds; the
          # affected drivers are simply excluded from the installer.
          DRIVER_DEPS_REQUIRED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'OFF' || 'ON' }}
        run: |
          mkdir -p build
          ccache --zero-stats
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_TRAY_TESTS=ON \
            -DBUILD_WEB_UI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DDRIVER_DEPS_REQUIRED=${DRIVER_DEPS_REQUIRED} \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/${{ github.repository }}' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/${{ github.repository }}/issues'
          ninja -C build

          # Printed so a run that suddenly gets slow can be diagnosed as a cache
          # miss rather than guessed at.
          ccache --show-stats

      - name: Save compiler objects
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ github.run_id }}

      - name: Run native tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Cache Inno Setup
        id: inno-cache
        uses: actions/cache@v6
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6.7.3

      - name: Install Inno Setup
        if: steps.inno-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Download and install Inno Setup 6 (silent install)
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedSha256 = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $installer = "$env:TEMP\innosetup.exe"
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
              $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256) {
                throw "Inno Setup SHA-256 mismatch: $actualSha256"
              }
              $bytes = [System.IO.File]::ReadAllBytes($installer)
              if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw 'Downloaded Inno Setup installer is not a valid Windows executable.'
              }
              $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Inno Setup installer exited with code $($process.ExitCode)."
              }
              $installed = $true
              break
            }
            catch {
              Write-Warning "Inno Setup install attempt $attempt failed: $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $installed) {
            throw 'Inno Setup installation failed after three attempts.'
          }

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Package Windows
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd build

          # Keep installer and portable outputs isolated. The installer must
          # always come from the Foundation Inno Setup definition, never CPack.
          rm -rf inno_staging inno_artifacts portable_artifacts
          mkdir -p inno_artifacts portable_artifacts
          cmake --install . --prefix ./inno_staging
          test -f ./inno_staging/tools/ds5-sidecar-package.json
          test ! -e ./inno_staging/tools/sunshine-ds5-sidecar/Sunshine.Ds5Sidecar.exe

          INNO_OUTPUT="$(cygpath -w "$(pwd)/inno_artifacts")"
          MSYS2_ARG_CONV_EXCL='/O' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/O${INNO_OUTPUT}" sunshine_installer.iss | tee inno-build.log
          grep -F "ds5-sidecar-package.json" inno-build.log

          cpack -G ZIP -B ./portable_artifacts --config ./CPackConfig.cmake --verbose
          cmake -E tar tf ./portable_artifacts/Sunshine.zip | tr '\\' '/' > portable-files.txt
          grep -F "Sunshine/tools/ds5-sidecar-package.json" portable-files.txt
          if grep -F "Sunshine/tools/sunshine-ds5-sidecar/Sunshine.Ds5Sidecar.exe" portable-files.txt; then
            echo "The optional DualSense runtime leaked into the main portable package"
            exit 1
          fi

          mv ./inno_artifacts/Sunshine.exe ../artifacts/sunshine-windows-installer.exe
          mv ./portable_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Rename release assets
        shell: msys2 {0}
        run: |
          # Format tag to vYEAR.DATE where DATE is zero-padded to 4 digits
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # 重命名安装包和便携版
          INSTALLER_NAME="Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-installer.exe "artifacts/${INSTALLER_NAME}"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.Portable-x64.zip"

          # Legacy Control Panel builds treat any release asset containing
          # "Windows" as a full installer. Keep that marker exclusive to the
          # actual installer so existing users can update to the fixed build.
          for asset in artifacts/*; do
            name=$(basename "$asset")
            lower=${name,,}
            if [[ "$lower" == *windows* && "$lower" != "${INSTALLER_NAME,,}" ]]; then
              echo "Non-installer release asset would confuse legacy updaters: $name"
              exit 1
            fi
          done

      - name: Generate Checksums
        shell: pwsh
        run: |
          # Generate SHA256 checksums after the assets have their final names.
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Generate Release Notes
        if: needs.setup_release.outputs.publish_release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.setup_release.outputs.release_tag }}
        run: |
          $releaseCommit = (git rev-parse HEAD).Trim()
          .\scripts\generate-app-display-release-notes.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -ReleaseCommit $releaseCommit `
            -ChecksumsPath .\artifacts\checksums.json `
            -OutputPath .\release-notes.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-windows-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.Portable-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: "artifacts/*"
          bodyFile: release-notes.md
          commit: ${{ needs.setup_release.outputs.release_commit }}
          generateReleaseNotes: true
          name: ${{ needs.setup_release.outputs.release_name }}
          prerelease: false
          tag: ${{ needs.setup_release.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
